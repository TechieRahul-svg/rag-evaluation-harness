name: RAG Evaluation Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  rag-evaluation:

    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 4. Build ChromaDB collections
      - name: Build Vector Database
        run: |
          python src/vectorstore/build_vectorstore.py


      # 5. Run retrieval benchmark
      - name: Run Retrieval Evaluation
        run: |
          python src/evaluation/run_retrieval_evaluation.py


      # 6. Check quality threshold
      - name: Check RAG Quality
        run: |
          python src/evaluation/ci_evaluate.py
