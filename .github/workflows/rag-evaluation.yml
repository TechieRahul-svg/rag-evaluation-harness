name: RAG Evaluation Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  rag-evaluation:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt


    - name: Run Retrieval Evaluation
      run: |
        python src/evaluation/run_retrieval_evaluation.py


    - name: Check RAG Quality
      run: |
        python src/evaluation/ci_evaluate.py
