
name: RAG Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rag-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q src tests

      - name: Run API smoke tests
        run: python -m pytest -q tests/

      - name: Build vector database
        run: python src/vectorstore/build_vectorstore.py

      - name: Verify vector database
        run: python src/vectorstore/check_vectorstore.py

      - name: Run retrieval evaluation
        run: python src/evaluation/run_retrieval_evaluation.py

      - name: Check retrieval quality threshold
        run: python src/evaluation/ci_evaluate.py
